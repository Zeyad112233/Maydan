  /* جهاز جديد أو بلا أي رصد: لا شيء يُحفظ منه، فتؤخذ بيانات السحابة كما هي (حتى لا تتكرر البنود الافتراضية) */
  const hasSc=S.halaqat.some(h=>(h.students||[]).some(st=>nums(st.scores||{})>0));
  if(!base0&&(!window._hadLocal||!hasSc))base0={m:c.meta,h:c.h};
  const first=!base0;
  if(first)try{if(!localStorage.getItem('maydan_bak_pre_sync_fix'))localStorage.setItem('maydan_bak_pre_sync_fix',JSON.stringify({t:Date.now(),local:S,cloud:{m:init.m,h:init.h}}))}catch(e){}
  const bm=first?undefined:P(base0.m),bh=first?{}:(base0.h||{});
  const batch=[];
  /* عند فتح الصفحة: لا نحذف من السحابة شيئًا لمجرد غيابه عن نسخة الجهاز (قد تكون نسخة الجهاز أقدم، مثلًا عند فتح تبويبين) */
  const mm=J(m3(bm,P(c.meta),P(init.m),first,true));if(mm!=null)batch.push({k:'m',id:'main',s:mm});
  const ids=[...new Set([...(init.m?(JSON.parse(init.m).order||[]):[]),...srvIds,...Object.keys(c.h)])];
  ids.forEach(id=>{const v=J(m3(first?undefined:P(bh[id]),P(c.h[id]),P(init.h[id]),first,true));if(v!=null)batch.push({k:'h',id,s:v})});
  sync.meta=init.m;sync.h={};srvIds.forEach(id=>sync.h[id]=init.h[id]);saveBase();
  cloudApply(batch,true);ready=true;window.cloudPush();
 }

 window.cloudForce=async()=>{
  if(!ready)throw new Error('not ready');
  while(pushing)await new Promise(r=>setTimeout(r,200));
  clearTimeout(tmr);tmr=null;queue=[];
  const c=split(),jobs=[],ts=Date.now();
  forcing=true;pushT0=Date.now();stat();
  sync.meta=c.meta;jobs.push(setDoc(metaRef,{data:c.meta,t:serverTimestamp()}));
  for(const id in c.h){sync.h[id]=c.h[id];jobs.push(setDoc(doc(hCol,id),{data:c.h[id],t:serverTimestamp()}))}
  for(const id of Object.keys(sync.h)){if(!(id in c.h)){delete sync.h[id];jobs.push(deleteDoc(doc(hCol,id)))}}
  const p=devPack();
  for(const k in p){jobs.push(setDoc(doc(db,'maydan_meta','dev_'+k),{data:JSON.stringify({ts,v:p[k]}),t:serverTimestamp()}));try{localStorage.setItem('maydan_dev_ts_'+k,String(ts))}catch(e){}}
  try{await Promise.all(jobs);saveBase();lastOk=Date.now();lastErr=null}catch(e){onErr(e);throw e}finally{forcing=false;stat()}
 };
 ['hist','maydan_bak_pre_weeks','maydan_bak_before_wipe'].forEach(k=>onSnapshot(doc(db,'maydan_meta','dev_'+k),snap=>{
  if(!snap.exists()||snap.metadata.hasPendingWrites)return;
  try{const o=JSON.parse(snap.data().data),mine=+localStorage.getItem('maydan_dev_ts_'+k)||0;
   if(o&&o.ts>mine&&window.devApply)devApply(k,o.v,o.ts)}catch(e){}},()=>{}));
 stat();
 /* إصلاح: لا نعتبر القاعدة «فارغة» ولا نرفع شيئًا قبل وصول رد مؤكَّد من خادم السحابة (وليس من كاش الجهاز) */
 onSnapshot(metaRef,{includeMetadataChanges:true},snap=>{
  const s=snap.exists()?snap.data().data:null;seen(snap);
  if(!ready){if(snap.metadata.fromCache)return;init.m=s;init.mOk=true;tryInit();return}
  if(snap.metadata.hasPendingWrites)return;incoming('m','main',s)},e=>{live=false;onErr(e)});
 onSnapshot(hCol,{includeMetadataChanges:true},snap=>{seen(snap);
  if(!ready){if(snap.metadata.fromCache)return;if(!init.hOk){init.h={};snap.docs.forEach(d=>init.h[d.id]=d.data().data);init.hOk=true;tryInit()}return}
  snap.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;
   incoming('h',c.doc.id,c.type==='removed'?null:c.doc.data().data)})},e=>{live=false;onErr(e)});
}
