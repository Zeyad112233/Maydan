 const gs=S.halaqat.filter(h=>!h.own);S.items=gs.length?gs[0].items.map(i=>({...i})):defItems();
 gs.forEach((h,hi)=>{if(hi===0)return;h.items.forEach((it,k)=>{const g=S.items[k];if(!g){S.items.push({...it});return}

<script type="module">
/* ============ إعدادات Firebase — الصق هنا بيانات مشروعك ============ */
const firebaseConfig = {

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,collection,onSnapshot,setDoc,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const st=(t,c)=>{const e=document.getElementById('cs');if(e){e.textContent=t;e.dataset.s=c}};
if(/PASTE/.test(firebaseConfig.apiKey)){st('☁ غير مفعّل (يعمل محليًا)','off')}
else{
 const app=initializeApp(firebaseConfig);
 let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=initializeFirestore(app,{})}
 const metaRef=doc(db,'maydan_meta','main'),hCol=collection(db,'maydan_halaqat');
 const sync={meta:null,h:{}};let ready=false,tmr=null,queue=[];const init={};
 const split=()=>{const {halaqat,...rest}=S;rest.order=halaqat.map(h=>h.id);
  return{meta:JSON.stringify(rest),h:Object.fromEntries(halaqat.map(h=>[h.id,JSON.stringify(h)]))}};
 const onErr=e=>{console.error(e);st(e&&e.code==='permission-denied'?'⚠ الصلاحيات (Rules)':'⚠ خطأ اتصال','err')};

 async function push(){
  tmr=null;if(!ready)return;const c=split(),jobs=[];
  if(c.meta!==sync.meta){sync.meta=c.meta;jobs.push(setDoc(metaRef,{data:c.meta,t:serverTimestamp()}))}
  for(const id in c.h){if(c.h[id]!==sync.h[id]){sync.h[id]=c.h[id];jobs.push(setDoc(doc(hCol,id),{data:c.h[id],t:serverTimestamp()}))}}
  for(const id in sync.h){if(!(id in c.h)){delete sync.h[id];jobs.push(deleteDoc(doc(hCol,id)))}}
  try{await Promise.all(jobs);st('☁ متزامن','ok')}catch(e){onErr(e)}
  const q=queue;queue=[];q.forEach(x=>incoming(x.k,x.id,x.s));
 }
 window.cloudPush=()=>{if(!ready)return;st('⏳ جارٍ الحفظ…','wait');clearTimeout(tmr);tmr=setTimeout(push,500)};

 function incoming(k,id,s){
  const cur=k==='m'?sync.meta:sync.h[id];
  if(s===cur||(s==null&&cur==null))return;
  if(tmr){queue.push({k,id,s});return}
  if(k==='m')sync.meta=s;else if(s==null)delete sync.h[id];else sync.h[id]=s;
  cloudApply([{k,id,s}]);st('☁ متزامن','ok');
 }
 function tryInit(){
  if(!(init.mOk&&init.hOk)||ready)return;
  const ids=Object.keys(init.h);
  if(init.m==null&&!ids.length){ready=true;push();return}   // قاعدة فارغة: نرفع البيانات الحالية
  const batch=[];if(init.m!=null){batch.push({k:'m',id:'main',s:init.m});sync.meta=init.m}
  ids.forEach(id=>{batch.push({k:'h',id,s:init.h[id]});sync.h[id]=init.h[id]});
  cloudApply(batch,true);ready=true;st('☁ متزامن','ok');window.cloudPush();
 }
 st('⏳ جارٍ الاتصال…','wait');
 onSnapshot(metaRef,snap=>{
  const s=snap.exists()?snap.data().data:null;
  if(!ready){init.m=s;init.mOk=true;tryInit();return}
  if(snap.metadata.hasPendingWrites)return;incoming('m','main',s)},onErr);
 onSnapshot(hCol,snap=>{
  if(!ready){if(!init.hOk){init.h={};snap.docs.forEach(d=>init.h[d.id]=d.data().data);init.hOk=true;tryInit()}return}
  snap.docChanges().forEach(c=>{if(c.doc.metadata.hasPendingWrites)return;
   incoming('h',c.doc.id,c.type==='removed'?null:c.doc.data().data)})},onErr);
}
